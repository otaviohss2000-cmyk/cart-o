<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Perfil - Basquete</title>
    <!-- Google Fonts: Montserrat (Títulos) e Inter (Texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card-container">
        <!-- Banner Superior -->
        <div class="card-banner"></div>

        <!-- Conteúdo do Cartão -->
        <div class="card-body">
            <!-- Avatar -->
            <div class="avatar-wrapper">
                <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=300&q=80" alt="Foto de Perfil" class="avatar-img">
            </div>

            <!-- Nome e Cargo (Grande e Centralizado) -->
            <h1 class="profile-name">Lucas Mendes</h1>
            <p class="profile-title">Treinador & Analista de Basquete</p>

            <!-- Tabela de Informações de Contato -->
            <div class="info-box">
                <div class="info-row">
                    <span class="label">EMAIL:</span>
                    <span class="value">lucas.basquete@email.com</span>
                </div>
                <div class="info-row">
                    <span class="label">TELEFONE:</span>
                    <span class="value">(11) 98765-4321</span>
                </div>
                <div class="info-row">
                    <span class="label">LOCALIZAÇÃO:</span>
                    <span class="value">São Paulo, SP</span>
                </div>
                <div class="info-row">
                    <span class="label">ESPECIALIDADE:</span>
                    <span class="value">Tática, Scouting & Treino</span>
                </div>
            </div>

            <!-- Botões Sociais -->
            <div class="social-buttons">
                <a href="#" class="btn-social">LinkedIn</a>
                <a href="#" class="btn-social btn-dark">GitHub</a>
                <a href="#" class="btn-social">Portfólio</a>
            </div>

            <!-- Botão de Ação Principal -->
            <button class="btn-primary">ENTRE EM CONTATO</button>
        </div>

        <!-- Rodapé do Cartão -->
        <footer class="card-footer">
            <span>Disponível para novos projetos e consultorias</span>
        </footer>
    </main>

</body>
</html>
